name: VS Build Tool 7.81
# Builds with the tool frozen at the 7.81 release (branch 7.81).
# The dashboard (Build > GitHub Actions) reads mode, builder and ROM from the run name.
run-name: "${{ inputs.mode }} | ${{ inputs.trigger }} | ${{ inputs.ROM_URL }}"

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: "OTA URL or device codename"
        required: true
        default: ""
      mode:
        description: "Build mode"
        required: true
        default: "vs"
        type: choice
        options:
          - vs
          - stock
          - stock-encrypted
      region:
        description: "ColorOS region for encrypted stock builds"
        required: false
        default: "cn"
      key:
        description: "Active Key"
        required: true
        default: ""
      trigger:
        description: "Builder name"
        required: true
        default: "Auto_Build"

jobs:
  Auth:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.evaluate.outputs.active }}
    steps:
      - name: Authentication
        id: evaluate
        run: echo "active=${{ github.event.inputs.key == secrets.AUTH_KEY }}" >> "$GITHUB_OUTPUT"

  Build:
    needs: Auth
    if: ${{ needs.Auth.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    environment: AutoBuild
    env:
      ROM_URL: ${{ github.event.inputs.ROM_URL }}
      BUILD_MODE: ${{ github.event.inputs.mode }}
      TOOL_BRANCH: "7.81"
      ROM_REGION: ${{ github.event.inputs.region || 'cn' }}
      BUILDER_NAME: ${{ github.event.inputs.trigger }}
      NOTIFY_ACTION_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NOTIFY_RUN_ID: ${{ github.run_id }}
      RCLONE_CONFIG_PASS: miuivs.com
      CI_LOW_DISK: "true"
      # Root filesystem fills up on large builds; put large caches and temp
      # files on the workspace volume created by "Maximize disk" instead.
      TMPDIR: ${{ github.workspace }}/.tmp
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      PIP_NO_CACHE_DIR: "1"
      # GitHub runners already allow pip --user installs; act images enforce PEP 668.
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - name: Parameters
        run: |
          echo "ROM_URL=$ROM_URL"
          echo "BUILD_MODE=$BUILD_MODE"
          echo "TOOL_BRANCH=$TOOL_BRANCH"
          echo "BUILDER_NAME=$BUILDER_NAME"
          echo "actor=${{ github.actor }}"
          echo "run_id=${{ github.run_id }}"

      # Steps guarded with env.ACT differ when the workflow runs locally
      # through nektos/act (see .github/act/run-local.sh).
      - name: Clean runner
        if: ${{ !env.ACT }}
        run: |
          docker rmi $(docker images -q) || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* mysql* php* || true
          sudo apt -y autoremove --purge || true

      # Install system packages before "Maximize disk" so they come out of the
      # free space pool instead of the fixed root reserve.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git lz4 wget zip unzip android-sdk-libsparse-utils brotli aria2 python3-pip zipalign apksigner xmlstarlet aapt p7zip-full
          python3 -m pip install --user --no-cache-dir ConfigObj pyTelegramBotAPI pytz requests cryptography
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || sudo ln -sf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo journalctl --vacuum-size=50M || true
          df -h /

      - name: Maximize disk
        if: ${{ !env.ACT }}
        uses: easimon/maximize-build-space@master
        with:
          # Keep enough space on the runner root for the Actions worker, step
          # logs and anything that still writes to / (sudo drops TMPDIR).
          # OTA repack decodes every REPLACE_XZ blob; with only 12G reserved the
          # root fs bottomed out at ~836M and the worker died ("lost
          # communication"). Workspace has 90G+ to spare, so reserve more for /.
          root-reserve-mb: 28672
          # Runner has 16 GB RAM; image tools (erofs, lpmake, 7z, apktool) can
          # spike past that. Swap lives on the build volume, which has room.
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # sudo defaults to env_reset, which strips TMPDIR/_JAVA_OPTIONS. The many
      # "sudo python3 ..." steps then fall back to /tmp on the root fs and fill
      # it up. Keep these across sudo so their temp lands on the workspace volume.
      - name: Keep TMPDIR across sudo
        if: ${{ !env.ACT }}
        run: |
          echo 'Defaults env_keep += "TMPDIR _JAVA_OPTIONS XDG_CACHE_HOME"' \
            | sudo tee /etc/sudoers.d/keep-tmpdir >/dev/null
          sudo chmod 440 /etc/sudoers.d/keep-tmpdir

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.VS_BUILD_TOOL }}
          repository: buihien224/VS_Build_Tool
          ref: "7.81"

      # act copies the local working tree (including uncommitted changes).
      - name: Checkout (local act)
        if: ${{ env.ACT }}
        uses: actions/checkout@v5

      - name: Validate build scripts
        run: |
          bash -n ./bhlnk
          python3 -m py_compile bin/patch_x9bl.py bin/lk_info.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Setup
        run: |
          chmod +x ./bhlnk bin/* || true
          aria2c -x 16 -s 16 -j 1 -o bin/rclone1 https://github.com/buihien224/toolbox_notification/releases/download/rclone/rclone1
          chmod +x bin/rclone1
          free -h
          df -h / "$GITHUB_WORKSPACE"

      - name: Run build
        run: |
          set -euo pipefail

          mkdir -p "$TMPDIR" "$GRADLE_USER_HOME" "$ANDROID_SDK_ROOT" "$XDG_CACHE_HOME"
          chmod 700 "$TMPDIR"
          # Java ignores TMPDIR; keep apktool/d8/gradle temp files off root.
          export _JAVA_OPTIONS="-Djava.io.tmpdir=$TMPDIR"

          # Confirm large paths are on the workspace volume, not root.
          df -h / "$GITHUB_WORKSPACE"

          sdk_root="$ANDROID_SDK_ROOT"

          find_sdkmanager() {
            find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x 2>/dev/null | head -n 1
          }

          sdkmanager="$(find_sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            command_tools_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            tools_tmp="$(mktemp -d)"
            trap 'rm -rf "$tools_tmp"' EXIT
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              "$command_tools_url" -o "$tools_tmp/commandlinetools.zip"
            unzip -q "$tools_tmp/commandlinetools.zip" -d "$tools_tmp/unpacked"
            rm -rf "$sdk_root/cmdline-tools/latest"
            mkdir -p "$sdk_root/cmdline-tools/latest"
            mv "$tools_tmp/unpacked/cmdline-tools"/* "$sdk_root/cmdline-tools/latest/"
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$sdkmanager"
          fi

          sdk_bin="$(dirname "$sdkmanager")"
          export PATH="$sdk_bin:$sdk_root/platform-tools:$PATH"
          packages=()
          [[ -x "$sdk_root/platform-tools/adb" && -x "$sdk_root/platform-tools/fastboot" ]] || packages+=("platform-tools")
          [[ -f "$sdk_root/platforms/android-34/android.jar" ]] || packages+=("platforms;android-34")
          [[ -x "$sdk_root/build-tools/34.0.0/aapt" ]] || packages+=("build-tools;34.0.0")
          if ((${#packages[@]})); then
            yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
            "$sdkmanager" --sdk_root="$sdk_root" "${packages[@]}"
          fi
          test -x "$sdk_root/platform-tools/adb"
          test -x "$sdk_root/platform-tools/fastboot"
          test -f "$sdk_root/platforms/android-34/android.jar"
          test -x "$sdk_root/build-tools/34.0.0/aapt"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > backend/local.properties
          test -s backend/local.properties
          adb version
          fastboot --version

          cleanup_ci_workspace() {
            status=$?
            echo "[CI CLEANUP] Releasing build intermediates (status=$status)"
            sudo rm -rf -- \
              "$GITHUB_WORKSPACE/zip_temp" \
              "$GITHUB_WORKSPACE/jar_temp" \
              "$GITHUB_WORKSPACE/img_temp"
            sudo find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              \( -name '*.raw' -o -name '*.seed' -o -name 'payload.bin' \) \
              -delete 2>/dev/null || true
            # The build command uploads the archive before returning. Release
            # final packages and retained firmware images so later Actions
            # steps can still write diagnostics/notifications.
            sudo find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              \( -name 'colourvs_*.7z' -o -name 'hypervs_*.7z' -o -name '*-ota_full-*.7z' \) \
              -delete 2>/dev/null || true
            sudo rm -rf -- "$GITHUB_WORKSPACE/ota_out"
            sudo find "$GITHUB_WORKSPACE" -mindepth 2 -maxdepth 2 -type d \
              -name firmware-update -exec rm -rf -- {} + 2>/dev/null || true
            df -h / "$GITHUB_WORKSPACE" || true
            return "$status"
          }
          trap cleanup_ci_workspace EXIT
          export NOTIFY_GITLOG="$(git log -1 --pretty=format:%s)"
          case "$BUILD_MODE" in
            vs)
              ./bhlnk build "$ROM_URL" "$BUILDER_NAME"
              ;;
            stock)
              ./bhlnk stock "$ROM_URL" "$BUILDER_NAME"
              ;;
            stock-encrypted)
              ./bhlnk buildstock "$ROM_URL" "$ROM_REGION" "$BUILDER_NAME" --enc
              ;;
            *)
              echo "Unknown BUILD_MODE: $BUILD_MODE"
              exit 1
              ;;
          esac

      - name: Diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          free -h || true
          df -h || true
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true
          echo "Largest directories on root filesystem:"
          sudo du -xh --max-depth=3 / 2>/dev/null | sort -rh | head -30 || true

      - name: Push stop notification
        if: ${{ failure() || cancelled() }}
        run: |
          if [[ "${{ job.status }}" == "cancelled" ]]; then
            ./bhlnk notification "$NOTIFY_ACTION_LINK" -1 "$(git log -1 --pretty=format:%s)" "$NOTIFY_RUN_ID" || true
          else
            ./bhlnk notification "$NOTIFY_ACTION_LINK" -2 "$(git log -1 --pretty=format:%s)" "$NOTIFY_RUN_ID" || true
          fi
