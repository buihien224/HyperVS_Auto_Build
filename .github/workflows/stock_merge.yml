name: Stock Merge
# Custom ROM = base stock ROM + donor partitions, packed as a stock OTA or run
# through the full VS patch pipeline (--mode vs). Upload goes to
# "$UPLOAD_REMOTE:$UPLOAD_DIR" (default gdrive3:custom_ota) via rclone in
# bin/stock_merge.sh; nothing in this workflow posts to Telegram.
run-name: "StockMerge ${{ inputs.mode }} | ${{ inputs.trigger }} | ${{ inputs.ROM_URL }}"

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: "Base stock ROM: OTA URL, codename or local zip"
        required: true
        default: ""
      DONOR_URL:
        description: "Donor ROM: OTA URL, codename or local zip"
        required: true
        default: ""
      PARTITIONS:
        description: "Partitions to take from the donor: name,name2 or dst=src (comma separated)"
        required: true
        default: ""
      META_URL:
        description: "ota_meta JSON (URL or path). Empty: dumped from the base payload.bin"
        required: false
        default: ""
      mode:
        description: "Pack mode"
        required: true
        default: "stock"
        type: choice
        options:
          - stock
          - vs
      branch:
        description: "Tool branch"
        required: true
        default: "BRICK"
        type: choice
        options:
          - BRICK
          - PREVIEW
          - STABLE
      device:
        description: "Device code override (empty: inferred from the meta)"
        required: false
        default: ""
      base_region:
        description: "ColorOS region for the base ROM codename"
        required: false
        default: "cn"
      donor_region:
        description: "ColorOS region for the donor ROM codename"
        required: false
        default: "cn"
      key:
        description: "Active Key"
        required: true
        default: ""
      trigger:
        description: "Builder name"
        required: true
        default: "Auto_Build"
      upload:
        description: "Upload the package to rclone (gdrive3:custom_ota)"
        required: true
        default: true
        type: boolean
      upload_remote:
        description: "rclone remote for the upload"
        required: false
        default: "gdrive3"
      upload_dir:
        description: "Folder on the remote"
        required: false
        default: "custom_ota"

# VS_NO_PUBLISH=true mutes every Telegram path in patchvs.sh; the rclone
# upload in bin/stock_merge.sh does not depend on it.
env:
  VS_OTA_ZIP_SECRET_V3: ${{ secrets.VS_OTA_ZIP_SECRET_V3 }}

jobs:
  Auth:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.evaluate.outputs.active }}
    steps:
      - name: Authentication
        id: evaluate
        run: echo "active=${{ github.event.inputs.key == secrets.AUTH_KEY }}" >> "$GITHUB_OUTPUT"

  Build:
    needs: Auth
    if: ${{ needs.Auth.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    environment: AutoBuild
    env:
      ROM_URL: ${{ github.event.inputs.ROM_URL }}
      DONOR_URL: ${{ github.event.inputs.DONOR_URL }}
      PARTITIONS: ${{ github.event.inputs.PARTITIONS }}
      META_URL: ${{ github.event.inputs.META_URL }}
      MERGE_MODE: ${{ github.event.inputs.mode }}
      TOOL_BRANCH: ${{ github.event.inputs.branch }}
      DEVICE_CODE: ${{ github.event.inputs.device }}
      BASE_REGION: ${{ github.event.inputs.base_region || 'cn' }}
      DONOR_REGION: ${{ github.event.inputs.donor_region || 'cn' }}
      BUILDER_NAME: ${{ github.event.inputs.trigger }}
      UPLOAD_ENABLED: ${{ github.event.inputs.upload }}
      UPLOAD_REMOTE: ${{ github.event.inputs.upload_remote || 'gdrive3' }}
      UPLOAD_DIR: ${{ github.event.inputs.upload_dir || 'custom_ota' }}
      RCLONE_CONFIG_PASS: miuivs.com
      CI_LOW_DISK: "true"
      # Root filesystem fills up on large builds; put large caches and temp
      # files on the workspace volume created by "Maximize disk" instead.
      TMPDIR: ${{ github.workspace }}/.tmp
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      PIP_NO_CACHE_DIR: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      VS_NO_PUBLISH: "true"

    steps:
      - name: Parameters
        run: |
          echo "ROM_URL=$ROM_URL"
          echo "DONOR_URL=$DONOR_URL"
          echo "PARTITIONS=$PARTITIONS"
          echo "META_URL=${META_URL:-auto}"
          echo "MERGE_MODE=$MERGE_MODE"
          echo "TOOL_BRANCH=$TOOL_BRANCH"
          echo "BUILDER_NAME=$BUILDER_NAME"
          echo "upload=$UPLOAD_ENABLED -> $UPLOAD_REMOTE:$UPLOAD_DIR"
          echo "actor=${{ github.actor }}"
          echo "run_id=${{ github.run_id }}"

      # Steps guarded with env.ACT differ when the workflow runs locally
      # through nektos/act (see .github/act/run-local.sh).
      - name: Clean runner
        if: ${{ !env.ACT }}
        run: |
          docker rmi $(docker images -q) || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* mysql* php* || true
          sudo apt -y autoremove --purge || true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git lz4 wget zip unzip android-sdk-libsparse-utils brotli aria2 python3-pip zipalign apksigner xmlstarlet aapt p7zip-full
          python3 -m pip install --user --no-cache-dir ConfigObj pytz requests cryptography
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || sudo ln -sf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo journalctl --vacuum-size=50M || true
          df -h /

      - name: Maximize disk
        if: ${{ !env.ACT }}
        uses: easimon/maximize-build-space@master
        with:
          # Two full OTA payloads (base + donor) are extracted on this volume;
          # reserve plenty of root for the Actions worker and logs.
          root-reserve-mb: 28672
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Keep TMPDIR across sudo
        if: ${{ !env.ACT }}
        run: |
          echo 'Defaults env_keep += "TMPDIR _JAVA_OPTIONS XDG_CACHE_HOME"' \
            | sudo tee /etc/sudoers.d/keep-tmpdir >/dev/null
          sudo chmod 440 /etc/sudoers.d/keep-tmpdir

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.VS_BUILD_TOOL }}
          repository: buihien224/VS_Build_Tool
          ref: ${{ github.event.inputs.branch }}

      # act copies the local working tree (including uncommitted changes).
      - name: Checkout (local act)
        if: ${{ env.ACT }}
        uses: actions/checkout@v5

      - name: Validate build scripts
        run: |
          bash -n ./bhlnk bin/stock_merge.sh
          python3 -m py_compile bin/ota_payload.py bin/payload_extract.py

      - name: Setup
        run: |
          chmod +x ./bhlnk bin/* || true
          aria2c -x 16 -s 16 -j 1 -o bin/rclone1 https://github.com/buihien224/toolbox_notification/releases/download/rclone/rclone1
          chmod +x bin/rclone1
          free -h
          df -h / "$GITHUB_WORKSPACE"

      # The VS pipeline (mode=vs) rebuilds the VS app modules and needs the
      # SDK; plain stock packing (mode=stock) only needs python + delta_generator.
      - name: Setup Java 17
        if: ${{ inputs.mode == 'vs' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        if: ${{ inputs.mode == 'vs' }}
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_SDK_ROOT"

          find_sdkmanager() {
            find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x 2>/dev/null | head -n 1
          }

          sdkmanager="$(find_sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            command_tools_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            tools_tmp="$(mktemp -d)"
            trap 'rm -rf "$tools_tmp"' EXIT
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              "$command_tools_url" -o "$tools_tmp/commandlinetools.zip"
            unzip -q "$tools_tmp/commandlinetools.zip" -d "$tools_tmp/unpacked"
            rm -rf "$sdk_root/cmdline-tools/latest"
            mkdir -p "$sdk_root/cmdline-tools/latest"
            mv "$tools_tmp/unpacked/cmdline-tools"/* "$sdk_root/cmdline-tools/latest/"
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$sdkmanager"
          fi

          sdk_bin="$(dirname "$sdkmanager")"
          export PATH="$sdk_bin:$sdk_root/platform-tools:$PATH"
          packages=()
          [[ -x "$sdk_root/platform-tools/adb" && -x "$sdk_root/platform-tools/fastboot" ]] || packages+=("platform-tools")
          [[ -f "$sdk_root/platforms/android-34/android.jar" ]] || packages+=("platforms;android-34")
          [[ -x "$sdk_root/build-tools/34.0.0/aapt" ]] || packages+=("build-tools;34.0.0")
          if ((${#packages[@]})); then
            yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
            "$sdkmanager" --sdk_root="$sdk_root" "${packages[@]}"
          fi
          test -x "$sdk_root/platform-tools/adb"
          test -f "$sdk_root/platforms/android-34/android.jar"
          test -x "$sdk_root/build-tools/34.0.0/aapt"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > backend/local.properties
          test -s backend/local.properties

      - name: Run merge
        run: |
          set -euo pipefail

          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
          chmod 700 "$TMPDIR"
          export _JAVA_OPTIONS="-Djava.io.tmpdir=$TMPDIR"
          # Compression and payload decoding get all but one CPU so the runner
          # keeps answering GitHub's agent.
          cpus="$(nproc)"
          export VS_BUILD_CPUS="$(( cpus > 1 ? cpus - 1 : 1 ))"
          echo "VS_BUILD_CPUS=$VS_BUILD_CPUS of $cpus"
          df -h / "$GITHUB_WORKSPACE"

          # bin/stock_merge.sh also exports VS_NO_PUBLISH=true; both ends are
          # covered so the VS pipeline never posts to Telegram.
          args=(--base "$ROM_URL" --donor "$DONOR_URL" --partitions "$PARTITIONS"
                --mode "$MERGE_MODE" --builder "$BUILDER_NAME"
                --base-region "$BASE_REGION" --donor-region "$DONOR_REGION")
          [[ -z "$META_URL" ]] || args+=(--meta "$META_URL")
          [[ -z "$DEVICE_CODE" ]] || args+=(--device "$DEVICE_CODE")
          if [[ "$UPLOAD_ENABLED" == "true" ]]; then
            args+=(--upload --upload-remote "$UPLOAD_REMOTE" --upload-dir "$UPLOAD_DIR")
          fi
          echo "bin/stock_merge.sh ${args[*]}"

          cleanup_ci_workspace() {
            status=$?
            echo "[CI CLEANUP] Releasing build intermediates (status=$status)"
            sudo rm -rf -- "$GITHUB_WORKSPACE/zip_temp" "$GITHUB_WORKSPACE/jar_temp" \
              "$GITHUB_WORKSPACE/img_temp" "$GITHUB_WORKSPACE/.stockmerge"
            sudo find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              \( -name '*.raw' -o -name '*.seed' -o -name 'payload.bin' \) \
              -delete 2>/dev/null || true
            df -h / "$GITHUB_WORKSPACE" || true
            return "$status"
          }
          trap cleanup_ci_workspace EXIT

          bin/stock_merge.sh "${args[@]}"

      - name: Package link
        if: ${{ !failure() && !cancelled() }}
        run: |
          out="$(ls -1t ota_out/*.zip 2>/dev/null | head -n 1 || true)"
          if [[ -z "$out" ]]; then
            echo "No package left in ota_out/ (uploaded and cleaned up)."
            exit 0
          fi
          echo "Package: $out ($(du -h -- "$out" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$UPLOAD_ENABLED" == "true" ]]; then
            link="$(bin/rclone1 link "$UPLOAD_REMOTE:$UPLOAD_DIR/$(basename -- "$out")" \
              --config bin/rclone.conf 2>/dev/null || true)"
            [[ -z "$link" ]] || {
              echo "Download: $link" | tee -a "$GITHUB_STEP_SUMMARY"
            }
          fi

      - name: Diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          free -h || true
          df -h || true
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true
          echo "Largest directories on root filesystem:"
          sudo du -xh --max-depth=3 / 2>/dev/null | sort -rh | head -30 || true
